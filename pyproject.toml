[project]
name = "north-lite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dave", email = "you@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cohere>=7.3.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
north-lite = "north_lite:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.6",
]
