name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; the image job asks for package write itself.
permissions:
  contents: read

# A new push to the same PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.22.1
  K8S_VERSION: 1.33.1

jobs:
  # The three jobs have no `needs:`, so they run in parallel.
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only full version tags (no floating v10).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true # keyed on uv.lock
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }} # tests/test_chart.py calls helm
      - run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy --strict src tests
      - name: pytest
        # Fake backend only: CI never holds the API key and never spends quota.
        run: uv run pytest -n auto -m "not live"

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ct diffs against the target branch
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/chart-testing-action@v2.9.0
      - name: ct lint
        # On PRs, also require a Chart.yaml version bump for any chart change.
        run: >-
          ct lint --config ct.yaml --all
          --check-version-increment=${{ github.event_name == 'pull_request' }}
      - name: helm unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1
          helm unittest charts/north-lite
      - name: kubeconform (every profile)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          scripts/validate-chart.sh "$K8S_VERSION"

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the GitHub Actions cache: unchanged dependency layers
          # are reused across runs, so only changed source is rebuilt.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One e2e environment per values-flags-*.yaml file: adding a profile file adds
  # a matrix leg, with no workflow edit. A profile that turns on the NetworkPolicy
  # gets a Calico cluster, because kindnet didn't enforce policies.
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          entries=()
          for f in charts/north-lite/values-flags-*.yaml; do
            p=$(basename "$f" .yaml); p=${p#values-flags-}
            if [ "$(yq '.networkPolicy.enabled // false' "$f")" = "true" ]; then cni=calico; else cni=kindnet; fi
            entries+=("$(jq -nc --arg p "$p" --arg c "$cni" '{profile: $p, cni: $c}')")
          done
          list=$(printf '%s\n' "${entries[@]}" | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "profiles: $list"

  e2e:
    name: e2e (${{ matrix.profile }}, ${{ matrix.cni }})
    # Don't spin up clusters for a chart that fails lint.
    needs: [chart, profiles]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false # one broken profile shouldn't hide the others' results
      matrix:
        include: ${{ fromJSON(needs.profiles.outputs.list) }}
    env:
      RELEASE: nl-${{ matrix.profile }}
      CHART: charts/north-lite
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-kind-env
        with:
          helm-version: ${{ env.HELM_VERSION }}
          cni: ${{ matrix.cni }}
      - name: helm install (${{ matrix.profile }})
        run: >-
          helm install "$RELEASE" "$CHART" -n "$RELEASE" --create-namespace
          -f "$CHART/values-ci.yaml" -f "$CHART/values-flags-${{ matrix.profile }}.yaml"
          --wait --timeout 180s
      - name: helm test
        run: helm test "$RELEASE" -n "$RELEASE" --logs --timeout 180s
      - name: collect diagnostics
        if: failure()
        run: scripts/collect-diagnostics.sh "$RELEASE" diagnostics
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-diagnostics-${{ matrix.profile }}
          path: diagnostics/
          retention-days: 7
