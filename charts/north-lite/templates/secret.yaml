{{- /* Only when a key value is given and no existing Secret is named (dev only). */ -}}
{{- if and .Values.apiKey.value (not .Values.apiKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "north-lite.fullname" . }}
  labels:
    {{- include "north-lite.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.apiKey.existingSecretKey }}: {{ .Values.apiKey.value | b64enc | quote }}
{{- end }}
