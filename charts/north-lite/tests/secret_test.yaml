suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: creates no Secret when existingSecret is set
    set:
      apiKey.existingSecret: cohere-api-key
    asserts:
      - hasDocuments:
          count: 0

  - it: prefers existingSecret even if a value is also given
    set:
      apiKey.existingSecret: cohere-api-key
      apiKey.value: dev-key
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a Secret from apiKey.value (dev only)
    set:
      apiKey.value: dev-key
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: data.CO_API_KEY
          value: ZGV2LWtleQ== # base64("dev-key")

  - it: creates nothing for the fake backend without a key
    set:
      config.backend: fake
    asserts:
      - hasDocuments:
          count: 0
